<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SD Icon Manager</title>
    <!-- Police MUI (Inter) et Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
    <!-- SIDEBAR (Menu latéral) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="material-symbols-outlined logo-icon">joystick</span>
            <h1>SD Manager</h1>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">
                <span class="material-symbols-outlined">photo_library</span>
                <span>Iconothèque</span>
            </a>
            <a href="#" class="nav-item">
                <span class="material-symbols-outlined">inventory_2</span>
                <span>Mes Packs</span>
            </a>
            <a href="#" class="nav-item">
                <span class="material-symbols-outlined">cloud_download</span>
                <span>Importer</span>
            </a>
        </nav>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <main class="main-content">
        <!-- APP BAR (Barre du haut) -->
        <header class="app-bar">
            <div class="import-zone">
            <input id="url-input" type="text" placeholder="Coller un lien SGDB ou une URL d’image..." class="mui-input" />
            <button id="download-btn" class="mui-btn primary">
                <span class="material-symbols-outlined btn-icon">download</span>
                Télécharger
            </button>
            <button id="steamgriddb-api-key-btn" class="mui-btn outlined">
                <span class="material-symbols-outlined btn-icon">key</span>
                Clé SGDB
            </button>
            <button id="local-files-btn" class="mui-btn outlined">
                <span class="material-symbols-outlined btn-icon">add</span>
                Fichiers locaux
            </button>
            <input id="file-input" type="file" accept="image/*" multiple hidden />
        </div>
    </header>

    <section class="tabs-container">
        <div class="tabs-header">
            <button id="search-tab-btn" class="tab-btn active" type="button">
                <span class="material-symbols-outlined">search</span>
                Recherche SteamGridDB
            </button>
            <button id="local-tab-btn" class="tab-btn" type="button">
                <span class="material-symbols-outlined">photo_library</span>
                Icônes locales
            </button>
        </div>

        <section id="search-tab-panel" class="tab-panel active">
            <div class="sgdb-search-zone">
                <input id="sgdb-search-input" type="text" placeholder="Rechercher les icônes d’un jeu sur SteamGridDB..." class="mui-input" />
                <button id="sgdb-search-btn" class="mui-btn outlined">
                    <span class="material-symbols-outlined btn-icon">search</span>
                    Rechercher
                </button>
            </div>

            <section id="sgdb-results-section" class="sgdb-results-section">
                <div class="grid-header">
                    <h2 id="sgdb-results-title">Résultats SteamGridDB</h2>
                    <button id="clear-sgdb-results-btn" class="mui-btn text">Effacer</button>
                </div>
                <div id="sgdb-results-grid" class="icon-grid">
                    <div class="empty-state">
                        <span class="material-symbols-outlined empty-state-icon">travel_explore</span>
                        <h2>Recherche SteamGridDB</h2>
                        <p>Entre le nom d’un jeu pour trouver directement ses icônes.</p>
                    </div>
                </div>

                <div class="load-more-container">
                    <button id="sgdb-load-more-btn" class="mui-btn outlined" type="button" hidden>
                        <span class="material-symbols-outlined btn-icon">expand_more</span>
                        Charger plus
                    </button>
                </div>
            </section>
        </section>

        <section id="local-tab-panel" class="tab-panel">
            <section class="grid-container">
                <div class="grid-header">
                    <h2>Iconothèque <span class="badge">0 icône</span></h2>
                    <div class="grid-actions">
                        <button id="rescan-library-btn" class="mui-btn outlined">
                            <span class="material-symbols-outlined btn-icon">refresh</span>
                            Rescanner
                        </button>
                        <button id="delete-selection-btn" class="mui-btn text danger">Supprimer la sélection</button>
                    </div>
                </div>
                <div class="icon-grid" id="icon-grid">
                    <!-- Les icônes apparaîtront ici -->
                </div>
            </section>
        </section>
    </section>
</main>
</div>

<script src="main.js"></script>
</body>
</html>
